[package]
name = "nano-coder"
version = "0.42.0"
edition = "2024"
description = "A 6MB coding agent for the terminal and for agent fleets: multi-provider, ACP, resumable sessions, plans."
license = "Apache-2.0"
repository = "https://github.com/nanobpm/nano-coder"
homepage = "https://github.com/nanobpm/nano-coder"
readme = "README.md"
keywords = ["ai", "agent", "coding-agent", "acp", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tla/", "eval/", "target/", "npm/", "scripts/", ".github/", "RELEASING.md"]

[[bin]]
name = "nano-coder"
path = "src/main.rs"

# Distributed binaries (GitHub releases, crates.io, npm) are built with
# `cargo build --release`; without this profile they ship cargo's defaults,
# which means unstripped symbols and no cross-crate optimisation. This keeps
# the binary small and fast. Note: no `panic = "abort"` — main.rs installs a
# panic hook that restores the terminal, and abort would skip it.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
fuzzy-matcher = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2", "system-proxy"] }
async-trait = "0.1.92"
regex = "1.13.1"
fastrand = "2.5.0"
libc = "0.2.189"
toml_edit = "0.22"
unicode-width = "0.2"
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
ratatui = "0.29"
vt100 = "0.15"
