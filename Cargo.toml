[package]
name = "agentic-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2", "system-proxy"] }
async-trait = "0.1.92"
regex = "1.13.1"
fastrand = "2.5.0"
libc = "0.2.189"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
