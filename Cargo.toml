[package]
name = "nano-coder"
version = "0.4.1"
edition = "2024"
description = "A 6MB coding agent for the terminal and for agent fleets: multi-provider, ACP, resumable sessions, plans."
license = "Apache-2.0"
repository = "https://github.com/nanobpm/nano-coder"
homepage = "https://github.com/nanobpm/nano-coder"
readme = "README.md"
keywords = ["ai", "agent", "coding-agent", "acp", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tla/", "target/", "npm/", "scripts/", ".github/", "TLA-plan.md", "RELEASING.md"]

[[bin]]
name = "nano-coder"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2", "system-proxy"] }
async-trait = "0.1.92"
regex = "1.13.1"
fastrand = "2.5.0"
libc = "0.2.189"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
