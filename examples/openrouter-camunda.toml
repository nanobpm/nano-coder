# OpenRouter for a regional workspace (such as Camunda's), the nano-coder
# equivalent of the opencode.json in Camunda's handbook ("Configuring OpenRouter
# with your IDE"). Copy it into ~/.config/nano-coder/config.toml (or pass
# --config) and export OPENROUTER_API_KEY. Model availability and hosts change:
# check them against the handbook before relying on this list.
#
# The workspace only accepts the regional hosts, and each model is served on
# one of them: the provider defaults to the US host, and models served in the
# EU set their own `base_url`.

model = "openrouter-camunda/moonshotai/kimi-k3"

# The built-in preset uses the global host, which the workspace rejects.
[providers.openrouter]
disabled = true

[providers.openrouter-camunda]
kind = "openai"
base_url = "https://us.openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# /model lists these models (with their names) instead of the whole catalogue.
list_models = "configured"
default_model = "moonshotai/kimi-k3"


[providers.openrouter-camunda.models."amazon/nova-2-lite-v1"]
name = "Nova 2 Lite"
base_url = "https://eu.openrouter.ai/api/v1"

