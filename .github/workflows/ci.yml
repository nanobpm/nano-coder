name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: compaction eval self-test (fake model)
        run: cargo build && python3 eval/compaction/run.py --self-test --seeds 1 --filler-turns 4 --bin target/debug/nano-coder --out "$RUNNER_TEMP/eval"
      - name: npm launcher syntax
        run: node --check npm/nano-coder/bin/nano-coder && node --check npm/nano-coder/install.js && node --check scripts/npm-packages.mjs
