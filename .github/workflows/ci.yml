name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Ratchet base for check-safe: on a push to main, HEAD and origin/main are the
# pushed commit, so compare against the commit before the push instead.
env:
  NANO_RATCHET_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
  # check-safe reads the Ratchet-Override trailers of a squash-merged PR's
  # commits through the GitHub API (the squash message drops them).
  GH_TOKEN: ${{ github.token }}

jobs:
  # The job names `test (<os>)` are required checks in the main branch ruleset.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      # Full history: check-safe compares the ratchets against the merge
      # base with origin/main (scripts/ratchets.sh).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      # Every check lives in scripts/ci.sh, which also runs locally (pre-push
      # runs its `quick` subset). Add checks there, not here.
      - run: ./scripts/ci.sh test

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      # Full history: check-safe compares the ratchets against the merge
      # base with origin/main (scripts/ratchets.sh).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: ./scripts/ci.sh lint
