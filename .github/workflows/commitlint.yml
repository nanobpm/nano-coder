name: Commit messages

# The PR title must follow Conventional Commits as configured in
# commitlint.config.mjs. main only allows squash merges, so the title becomes the
# single commit subject on main and is what semantic-release reads to pick the
# next version. Intermediate PR commits never reach main, so they are not linted
# (a long work-in-progress subject must not block the merge).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @commitlint/cli@21 @commitlint/config-conventional@21
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose
