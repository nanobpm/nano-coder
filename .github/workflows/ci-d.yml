name: CI (D port)

on:
  pull_request:
    paths: ["d/**", ".github/workflows/ci-d.yml"]
  push:
    branches: [main]
    paths: ["d/**", ".github/workflows/ci-d.yml"]

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    defaults:
      run:
        working-directory: d
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub test
      - run: dub build -b release
      - run: ./nano-coder-d --version
