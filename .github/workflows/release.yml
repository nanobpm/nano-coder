name: Release

# Tag `vX.Y.Z` (matching Cargo.toml) to build binaries, create a GitHub release,
# and publish to crates.io (`nano-coder`) and npm (`@nanobpm/nano-coder` plus one
# `@nanobpm/nano-coder-<os>-<cpu>` package per platform).
#
# Auth: trusted publishing (OIDC) on both registries — no long-lived tokens.
# Trusted publishers can only be configured once a package exists, so the FIRST
# release needs either a maintainer publishing locally or these repo secrets,
# which are used when present:
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish-new scope)
#   NPM_TOKEN            — npm automation token with publish rights on @nanobpm
# See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $crate"; exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, npm: darwin-x64 }
          # Ubuntu 22.04 runners link against glibc 2.35 for broad compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/nano-coder --help
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nano-coder dist/nano-coder-${{ matrix.npm }}
          tar -C target/${{ matrix.target }}/release -czf dist/nano-coder-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz nano-coder
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.npm }}
          path: dist/*

  github-release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes *.tar.gz SHA256SUMS

  crates-io:
    needs: [version, build]
    if: github.ref_type == 'tag' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Trusted publishing token
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish (skipped if this version is already on crates.io)
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "nano-coder-release (github.com/nanobpm/nano-coder)" "https://crates.io/api/v1/crates/nano-coder/$v" >/dev/null; then
            echo "nano-coder $v already published; skipping"
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  npm:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins
      - run: node scripts/npm-packages.mjs --version ${{ needs.version.outputs.version }} --binaries bins --out npm-dist
      - name: Publish (platform packages first, then the main package)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.ref_type != 'tag' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flags=(--access public --provenance)
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          publish() {
            local id
            id=$(node -p "const p=require('./$1/package.json'); p.name+'@'+p.version")
            if npm view "$id" version >/dev/null 2>&1; then
              echo "$id already published; skipping"
            else
              (cd "$1" && npm publish "${flags[@]}")
            fi
          }
          for d in npm-dist/*/; do
            d=${d%/}
            [ "$d" = "npm-dist/nano-coder" ] && continue
            publish "$d"
          done
          publish npm-dist/nano-coder
