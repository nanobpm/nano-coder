name: Release

# Every push to main runs semantic-release. When the Conventional Commits since
# the last tag call for a release (fix: -> patch, feat: -> minor, `!`/BREAKING
# CHANGE -> major), it sets the version in Cargo.toml/Cargo.lock, commits
# `chore(release): X.Y.Z`, tags `vX.Y.Z` and creates the GitHub release. The jobs
# below then build binaries, attach them to the release, and publish to
# crates.io (`nano-coder`) and npm (`@nanobpm/nano-coder` plus one
# `@nanobpm/nano-coder-<os>-<cpu>` package per platform).
#
# Auth: main is protected by a ruleset that only the release GitHub App may
# bypass, so semantic-release pushes with that app's token (vars.RELEASE_APP_CLIENT_ID,
# secrets.RELEASE_APP_PRIVATE_KEY). Registries use trusted publishing (OIDC); the
# publisher config names this file, so keep it called release.yml. See RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the next version, build and pack; release and publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Pushing, tagging, releasing and commenting use the app token below.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - name: Release app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_VERSION_FILE: ${{ runner.temp }}/next-version
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run --no-ci)
          npx --yes \
            -p semantic-release@25 \
            -p @semantic-release/exec@7 \
            -p @semantic-release/git@11 \
            -p @semantic-release/github@12 \
            semantic-release "${flags[@]}"
      - id: v
        shell: bash
        env:
          RELEASE_VERSION_FILE: ${{ runner.temp }}/next-version
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          next="$(cat "$RELEASE_VERSION_FILE" 2>/dev/null || true)"
          if [ -n "$next" ] && [ "$DRY_RUN" != "true" ]; then
            git fetch --tags --quiet
            git rev-parse -q --verify "refs/tags/v$next" >/dev/null || { echo "::error::tag v$next missing"; exit 1; }
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$next" ] && [ "$DRY_RUN" = "true" ]; then
            # Nothing to release: dry-run the current version.
            next="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "next version: ${next:-none}"

  build:
    needs: release
    if: needs.release.outputs.version != ''
    name: build ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, npm: darwin-x64 }
          # Ubuntu 22.04 runners link against glibc 2.35 for broad compatibility.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.released == 'true' && format('v{0}', needs.release.outputs.version) || github.sha }}
      # No-op for a release (the tag already has it); sets the dry-run version.
      - run: node scripts/set-version.mjs ${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/nano-coder --help
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nano-coder dist/nano-coder-${{ matrix.npm }}
          tar -C target/${{ matrix.target }}/release -czf dist/nano-coder-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz nano-coder
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.npm }}
          path: dist/*

  github-release:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          gh release upload "v${{ needs.release.outputs.version }}" --repo "${GITHUB_REPOSITORY}" --clobber *.tar.gz SHA256SUMS

  crates-io:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Already published?
        id: exists
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "nano-coder-release (github.com/nanobpm/nano-coder)" "https://crates.io/api/v1/crates/nano-coder/$v" >/dev/null; then
            echo "nano-coder $v already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trusted publishing token
        id: auth
        if: steps.exists.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.exists.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins
      - run: node scripts/npm-packages.mjs --version ${{ needs.release.outputs.version }} --binaries bins --out npm-dist
      - name: Publish (platform packages first, then the main package)
        shell: bash
        env:
          DRY_RUN: ${{ needs.release.outputs.released != 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          flags=(--access public --provenance)
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          publish() {
            local id
            id=$(node -p "const p=require('./$1/package.json'); p.name+'@'+p.version")
            if npm view "$id" version >/dev/null 2>&1; then
              echo "$id already published; skipping"
            else
              (cd "$1" && npm publish "${flags[@]}")
            fi
          }
          for d in npm-dist/*/; do
            d=${d%/}
            [ "$d" = "npm-dist/nano-coder" ] && continue
            publish "$d"
          done
          publish npm-dist/nano-coder
